# Serves the repository as it is (index.json at the top, zips in submissions/) on GitHub Pages.
# Nothing is signed here: the maintainer signs index.json on their machine and pushes it.
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["index.json", "index.json.sig", "index.key", "previews/**", "submissions/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Two jobs, not one: asked for in the same second it was uploaded, the site's artifact was
  # sometimes not listed yet, and the deployment failed with "No artifacts named
  # github-pages were found".  A job of its own starts after the upload has settled.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only what the app reads
        run: |
          mkdir site
          cp index.json index.json.sig index.key site/
          cp -r submissions site/
          [ -d previews ] && cp -r previews site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
